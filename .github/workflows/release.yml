name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v6
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swift-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-swift-

      - name: Build universal app and zip
        run: make release

      - name: Verify artifacts
        run: |
          test -n "$(find dist -maxdepth 1 -name '*.zip' -print -quit)" || { echo "::error::No zip was produced"; exit 1; }
          cd dist
          shasum -a 256 *.zip > SHA256SUMS
          cat SHA256SUMS
          ls -lh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.zip \
            dist/SHA256SUMS \
            --title "Sunroom ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
