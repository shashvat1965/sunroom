name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, test and package
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-swift-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-swift-

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: swift test

      - name: Core stays platform-free
        run: |
          if grep -R -n -E '^[[:space:]]*import[[:space:]]+(AppKit|Cocoa|SwiftUI|ScreenCaptureKit|ApplicationServices)' Sources/SunroomCore; then
            echo "::error::SunroomCore must not import platform UI or capture frameworks. Move the code to SunroomKit."
            exit 1
          fi
          echo "SunroomCore imports are clean."

      - name: Package the app
        run: make app
